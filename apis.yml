aid: skiptown
name: Skiptown
description: 'Skiptown is a modern pet-care company operating premium dog daycare,
  boarding, grooming, and walking services alongside its signature Dog Bar & Park
  — an indoor/outdoor social club where owners enjoy craft cocktails and coffee while
  dogs play off-leash. Backed by Techstars, Skiptown runs company-owned locations in
  Charlotte, Atlanta, and Denver and offers franchise expansion opportunities. Its
  consumer experience is delivered through a mobile app for booking, curbside dropoff,
  and daily photo updates. Skiptown does not currently publish a public API or developer
  platform; this profile captures its public web and security posture.'
